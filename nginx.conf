## nginx configuration for RFQ Portal
## Place this in /etc/nginx/sites-available/rfq_portal
## Then: ln -s /etc/nginx/sites-available/rfq_portal /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name rfq.yourcompany.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rfq.yourcompany.com;

    # ── SSL certificates (use Let's Encrypt / certbot) ──
    ssl_certificate     /etc/letsencrypt/live/rfq.yourcompany.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rfq.yourcompany.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Upload size (match app MAX_CONTENT_LENGTH) ──────
    client_max_body_size 10M;

    # ── Static files served directly by nginx ────────────
    location /static/ {
        alias /path/to/rfq_production/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Uploads (read-only via download route, never direct) ──
    location /uploads/ {
        deny all;
        return 403;
    }

    # ── App — proxy to gunicorn ─────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_buffering    on;
        proxy_buffer_size  8k;
    }
}
